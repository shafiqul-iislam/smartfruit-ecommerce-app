<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark/Light Mode</title>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configure Tailwind dark mode after CDN loads
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    body {
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>
<body class="bg-white text-black dark:bg-gray-900 dark:text-white min-h-screen flex flex-col items-center justify-center">

  <button id="theme-toggle" class="px-4 py-2 mb-5 bg-gray-200 dark:bg-gray-700 rounded">
    Toggle Dark/Light
  </button>

  <h1 class="text-3xl font-bold">Hello, World!</h1>
  <p class="mt-2">Dark/light mode example with Tailwind + jQuery.</p>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(function () {
      const body = $("body");

      // Load saved theme
      if (localStorage.getItem("theme") === "dark") {
        body.addClass("dark");
      }

      // Toggle and save
      $("#theme-toggle").on("click", function () {
        body.toggleClass("dark");
        localStorage.setItem("theme", body.hasClass("dark") ? "dark" : "light");
      });
    });
  </script>

</body>
</html>
